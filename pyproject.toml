[project]
name = "ai-erp"
version = "0.1.0"
description = "AI-powered ERP backend (FastAPI + SQLAlchemy) for SME manufacturing/distribution"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "passlib>=1.7.4",
    "email-validator>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
anthropic = ["anthropic>=0.34"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
  "E501",   # line length is handled by the formatter, not enforced hard
  "E741",   # `l` is used throughout for "line" in dumps/comprehensions
  "B008",   # FastAPI relies on function calls (Depends/Query) in argument defaults
  "UP007",  # keep Optional[X] / Union style flexibility
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["F401", "E402"]
"scripts/*" = ["F841"]
"tests/*" = ["F841", "E402"]
"app/models/__init__.py" = ["F401"]
