# Fly.io config for the AI ERP API.
#   fly launch --no-deploy         (creates the app; keep this file)
#   fly postgres create --name ai-erp-db
#   fly postgres attach ai-erp-db  (sets DATABASE_URL secret)
#   fly secrets set SECRET_KEY=$(python -c "import secrets;print(secrets.token_urlsafe(48))")
#   fly secrets set CORS_ORIGINS=https://ai-erp-web.fly.dev
#   fly deploy
app = "ai-erp-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  AUTO_CREATE_TABLES = "false"
  LOG_JSON = "true"
  PORT = "8000"
  WEB_CONCURRENCY = "2"
  AI_PROVIDER = "rule"          # set to "anthropic" + fly secrets set ANTHROPIC_API_KEY=...

[[services]]
  protocol = "tcp"
  internal_port = 8000
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[services.http_checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "get"
    path = "/health"

[deploy]
  release_command = "alembic upgrade head"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
