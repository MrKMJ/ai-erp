# Render blueprint — free deploy of the whole stack from one account.
#
#   1. Push this repo to GitHub.
#   2. render.com  ->  New  ->  Blueprint  ->  pick the repo.  Render reads this file.
#   3. Approve. First deploy takes a few minutes; the API runs `alembic upgrade head`
#      on boot (see docker/entrypoint.sh).
#
# Notes on the free tier:
#   * The API is a free Web Service: it SLEEPS after 15 min idle and cold-starts in
#     ~50s. The frontend retries automatically while it wakes.
#   * Render's free Postgres expires after 30 days. For a permanent free database,
#     create one at neon.tech and set DATABASE_URL on the API service to its
#     connection string (the app normalizes postgres:// automatically).
#   * The static site never sleeps and has no such limits.

databases:
  - name: ai-erp-db
    plan: free
    databaseName: ai_erp
    user: erp

services:
  - type: web
    name: ai-erp-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: LOG_JSON
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: AI_PROVIDER
        value: rule
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-erp-db
          property: connectionString
      # ai-erp-api was taken, so Render suffixed our API to ai-erp-api-42ja;
      # the web service kept the plain name. Keep these two in sync with the
      # actual Render URLs.
      - key: CORS_ORIGINS
        value: https://ai-erp-web.onrender.com

  - type: web
    name: ai-erp-web
    runtime: static
    buildCommand: cd frontend && npm ci && NEXT_OUTPUT=export npm run build
    staticPublishPath: ./frontend/out
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-erp-api-42ja.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    # Next static export prerenders every route to its own .html (/sales -> sales.html)
    # and emits 404.html — Render serves both natively, no SPA fallback needed.
